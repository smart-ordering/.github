<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Qi Tech Ltd.</title>
  <desc id="desc">Технологии для ресторанов и торговли.</desc>
  <defs>
    <radialGradient id="glow" cx="75%" cy="10%" r="90%">
      <stop offset="0" stop-color="#262039"/>
      <stop offset="1" stop-color="#0c0d16"/>
    </radialGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#c9d4e4"/>
      <stop offset="0.62" stop-color="#f1eaff"/>
      <stop offset="1" stop-color="#a6b2c9"/>
    </linearGradient>
    <linearGradient id="line">
      <stop stop-color="#7be5ee"/>
      <stop offset="0.5" stop-color="#b6a1ed"/>
      <stop offset="1" stop-color="#0c0d16"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="360" rx="16" fill="url(#glow)"/>
  <rect x="1" y="1" width="1278" height="358" rx="15" fill="none" stroke="#363344"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="72" y="159" font-size="112" font-weight="700" letter-spacing="-5" fill="url(#silver)">QITECH<tspan font-size="42" font-weight="400" letter-spacing="-1" dx="16">ltd.</tspan></text>
    <text x="78" y="224" font-size="31" letter-spacing="-0.6" fill="#c4bed6">Технологии для ресторанов и торговли.</text>
    <text x="78" y="301" font-size="16" letter-spacing="3" fill="#8c879f">СЕРВИС  /  ЗАКАЗЫ  /  ОПЕРАЦИИ</text>
    <text x="1200" y="301" font-size="17" text-anchor="end" fill="#c4bed6">AI Lillu</text>
  </g>
  <rect x="78" y="255" width="1122" height="1" fill="url(#line)"/>
</svg>
